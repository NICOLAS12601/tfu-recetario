events {}

http {
  # DNS de Docker. Con la URL en una variable, nginx resuelve el nombre en
  # cada pedido: arranca aunque un servicio esté caído y se recupera solo.
  resolver 127.0.0.11 valid=5s ipv6=off;
  proxy_connect_timeout 2s;

  server {
    listen 80;

    location /listas {
      set $lista http://lista-compras:8080;
      proxy_pass $lista;
    }

    location /productos {
      set $inventario http://inventario-recetas:8081;
      proxy_pass $inventario;
    }

    location /recetas {
      set $inventario http://inventario-recetas:8081;
      proxy_pass $inventario;
    }
  }
}
