# Un contenedor por servicio. Los tres servicios NestJS usan la misma imagen;
# la variable SERVICE elige cuál arranca (ver src/main.ts).
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recetario
      POSTGRES_PASSWORD: recetario
      POSTGRES_DB: recetario
    volumes:
      - db_data_soa:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recetario"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Producto + Receta: el único servicio con base de datos.
  inventario-recetas:
    build: .
    container_name: inventario-recetas
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE: inventario-recetas
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: recetario
      DB_PASSWORD: recetario
      DB_NAME: recetario
      SOAP_URL: http://inventario-recetas:8081/ws
    ports:
      - "8081:8081"

  precios:
    build: .
    container_name: precios
    restart: unless-stopped
    environment:
      SERVICE: precios
      PORT: 8082
    ports:
      - "8082:8082"

  lista-compras:
    build: .
    container_name: lista-compras
    restart: unless-stopped
    environment:
      SERVICE: lista-compras
      PORT: 8080
      # URLs de los otros servicios: por nombre dentro de la red de compose.
      INVENTARIO_SOAP_URL: http://inventario-recetas:8081/ws
      PRECIOS_URL: http://precios:8082
      CB_ENABLED: ${CB_ENABLED:-true}
    ports:
      - "8080:8080"

  # Gateway: solo enruta, sin lógica de negocio.
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"

volumes:
  db_data_soa:
